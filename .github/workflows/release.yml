# 릴리스 파이프라인 — tag(v*) push 트리거 (20260810_tag-push-release-pipeline).
#
# 흐름: 릴리스 노트 추출(annotated tag 본문) → 빌드(Developer ID 서명, 1단계에서 확정한 오버라이드
# 그대로) → DMG 패키징(create-dmg) → 공증(notarytool, ASC API 키) + 스테이플
# → generate_appcast(EdDSA 서명 + 노트 임베드) → GitHub Release 업로드
# → Homebrew cask bump (pilyang/homebrew-tap).
#
# 버전은 tag에서 파생한다: v1.2.3 → MARKETING_VERSION=1.2.3, CURRENT_PROJECT_VERSION=1.2.3
# (CFBundleVersion이 Sparkle의 비교 대상 sparkle:version이 된다 — semver 증가가 곧 단조 증가).
#
# 릴리스 노트도 tag에서 파생한다: annotated tag 본문 하나가 원본이고, 앱 업데이트 다이얼로그
# (appcast <description>)와 GitHub Release 본문이 모두 여기서 나온다 (작성 규칙은 CLAUDE.md).
#
# 필요한 GH Secrets 5종:
#   MACOS_CERT_P12          — Developer ID Application 인증서+개인키 p12의 base64
#   MACOS_CERT_PASSWORD     — 위 p12의 암호
#   ASC_API_KEY_P8          — App Store Connect API 키(.p8) 내용 (공증용)
#   SPARKLE_ED_PRIVATE_KEY  — Sparkle EdDSA 개인키 (generate_keys -x 출력)
#   TAP_PUSH_TOKEN          — pilyang/homebrew-tap 한정 fine-grained PAT (Contents: write)
#
# 주의: appcast는 `releases/latest/download/appcast.xml` 고정 URL로 소비되므로
# 정식 릴리스만 non-prerelease로 발행해야 한다 (20260810_appcast-hosting-github-releases).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  # 앱이 링크하는 Sparkle 버전(Package.resolved)과 맞춘다 — 의존성 버전을 올리면 여기도 함께.
  SPARKLE_VERSION: 2.9.5
  # 위 버전 배포 tarball(Sparkle-$SPARKLE_VERSION.tar.xz)의 SHA-256 — 버전을 올리면 반드시 함께 갱신.
  # 서명 자재가 살아 있는 잡에서 실행되는 툴이라 다운로드를 다이제스트로 고정한다
  # (SPM 의존성의 Package.resolved 핀과 같은 원칙).
  SPARKLE_SHA256: 015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 120 # 공증 대기 포함 (첫 제출 ~50분 실측)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 릴리스 노트의 원본은 annotated tag 본문이다 — 제목 줄은 릴리스 제목(--title)이 따로 쓴다.
      # lightweight 태그에서는 %(contents:body)가 가리키는 커밋의 본문을 조용히 돌려주므로
      # 객체 타입을 먼저 확인해야 커밋 메시지가 릴리스 노트로 둔갑하지 않는다 (v0.1.0이 실제로 그 상태).
      # 여러 줄 값이라 $GITHUB_ENV로 넘기지 않고 최종 소비처인 파일로 바로 쓴다:
      # dist/VimAction-$VERSION.md는 generate_appcast의 노트 규약(아카이브와 같은 basename)이자
      # gh release create --notes-file의 입력이다. dist는 원래 Package DMG가 만들지만 여기서 먼저 필요하다.
      # 빌드·공증에 ~50분이 걸리므로 판정은 그 앞에서 끝낸다.
      - name: Extract release notes from tag
        run: |
          # cat-file은 없는 ref에서 죽으므로 감싼다 — 실패 사유를 우리 메시지로 내보내기 위해.
          TAG_TYPE="$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null || echo missing)"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is not an annotated tag ($TAG_TYPE) — re-tag with 'git tag -a'"
            exit 1
          fi
          # 명령 치환이 후행 개행을 지우므로 이것이 곧 trim이다.
          NOTES="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::annotated tag $GITHUB_REF_NAME has an empty body — the body is the release notes"
            exit 1
          fi
          mkdir -p dist
          printf '%s\n' "$NOTES" > "dist/VimAction-$VERSION.md"
          echo "--- release notes ---"
          cat "dist/VimAction-$VERSION.md"

      # 임시 키체인에만 인증서를 넣는다 — 러너 login 키체인 오염 방지, 종료 시 삭제.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # codesign이 UI 프롬프트 없이 키를 쓸 수 있어야 한다 (headless 러너).
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # 1단계에서 확정한 서명 오버라이드 그대로 (CLAUDE.md·플랜 참고).
      # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO 필수 — 기본값이 get-task-allow를 주입해 공증 거부.
      - name: Build Release (Developer ID, Hardened Runtime)
        run: >
          xcodebuild build
          -project VimAction.xcodeproj
          -scheme VimAction
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath build
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=X6DU3VVLRZ
          CODE_SIGN_IDENTITY="Developer ID Application"
          ENABLE_HARDENED_RUNTIME=YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
          OTHER_CODE_SIGN_FLAGS=--timestamp
          MARKETING_VERSION="$VERSION"
          CURRENT_PROJECT_VERSION="$VERSION"

      # SPM의 Sparkle 아티팩트는 중첩 실행물(XPC 2종·Autoupdate·Updater.app)이 adhoc 서명이고
      # Xcode 임베드가 재서명하지 않아 공증이 거부된다(v0.1.0 첫 제출 Invalid 실측) —
      # Sparkle 공식 custom signing 순서대로 안쪽부터 재서명하고 마지막에 앱 씰을 다시 만든다.
      # Downloader.xpc만 --preserve-metadata=entitlements — 샌드박스 엔타이틀먼트를 지닌 유일한 컴포넌트.
      - name: Re-sign Sparkle nested components
        run: |
          APP="build/Build/Products/Release/VimAction.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          ID="Developer ID Application"
          codesign -f -s "$ID" -o runtime --timestamp --preserve-metadata=entitlements \
            "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          codesign -f -s "$ID" -o runtime --timestamp "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          codesign -f -s "$ID" -o runtime --timestamp "$SPARKLE/Versions/B/Autoupdate"
          codesign -f -s "$ID" -o runtime --timestamp "$SPARKLE/Versions/B/Updater.app"
          codesign -f -s "$ID" -o runtime --timestamp "$SPARKLE"
          codesign -f -s "$ID" -o runtime --timestamp "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package DMG
        run: |
          # create-dmg는 셸 스크립트라 설치가 불필요하다 — brew(핀 없는 가변 최신) 대신
          # 커밋 SHA로 소스를 고정해 바로 실행한다. 태그: v1.3.0
          CREATE_DMG_SHA=a2b71d0fda6d0df2a86dc7f67082d4d73e84c59f
          git clone --no-checkout https://github.com/create-dmg/create-dmg.git "$RUNNER_TEMP/create-dmg"
          git -C "$RUNNER_TEMP/create-dmg" checkout --quiet "$CREATE_DMG_SHA"
          STAGE="$RUNNER_TEMP/dmg-root"
          mkdir -p "$STAGE" dist
          cp -R "build/Build/Products/Release/VimAction.app" "$STAGE/"
          # create-dmg는 Finder AppleScript로 레이아웃을 잡아 headless 러너에서 간헐 실패한다 — 재시도.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/create-dmg/create-dmg" \
              --volname "VimAction" \
              --window-size 540 380 \
              --icon-size 128 \
              --icon "VimAction.app" 140 180 \
              --hide-extension "VimAction.app" \
              --app-drop-link 400 180 \
              "dist/VimAction-$VERSION.dmg" \
              "$STAGE"; then
              break
            fi
            rm -f "dist/VimAction-$VERSION.dmg"
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          codesign --force --sign "Developer ID Application" --timestamp \
            "dist/VimAction-$VERSION.dmg"

      # Developer ID 개인키는 DMG 서명까지만 쓰인다 — 이후 스텝은 키체인이 불필요하다
      # (notarytool=ASC API 키 파일, generate_appcast=EdDSA 키 파일, gh·git=토큰).
      # 여기서 바로 삭제해 개인키 노출 구간을 줄인다. 마지막 정리 스텝은 실패 대비 백스톱.
      - name: Delete signing keychain (no longer needed)
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s login.keychain-db

      # DMG를 공증하면 내용물(.app)까지 티켓이 발급된다. 스테이플은 DMG에.
      - name: Notarize and staple
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          KEY_FILE="$RUNNER_TEMP/AuthKey_J25P43B5G4.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_FILE"
          xcrun notarytool submit "dist/VimAction-$VERSION.dmg" \
            --key "$KEY_FILE" \
            --key-id J25P43B5G4 \
            --issuer 4c66c8b6-9bec-4f18-b220-a53d27eeac23 \
            --wait
          rm "$KEY_FILE"
          xcrun stapler staple "dist/VimAction-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature \
            "dist/VimAction-$VERSION.dmg"

      # 도구는 앱이 링크하는 것과 같은 버전의 Sparkle 배포 tarball에서 가져오고,
      # 다이제스트 검증을 통과해야만 실행한다.
      #
      # appcast는 매번 새 DMG 하나뿐인 dist에서 생성되므로 아이템이 1개다 — 여러 버전을 건너뛴
      # 사용자는 업데이트 다이얼로그에서 최신 버전 노트만 본다 (전체 히스토리는 아래 Version History 링크).
      # 피드 서명은 opt-in(앱 Info.plist에 SURequireSignedFeed 없음)이라 <description>은 서명 대상이 아니다 —
      # 오타는 appcast.xml을 고쳐 `gh release upload <tag> appcast.xml --clobber`로 정정할 수 있지만,
      # 그 순간 태그 본문(원본)과 어긋나므로 예외 경로다.
      - name: Generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          KEY_FILE="$RUNNER_TEMP/eddsa_private_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          # --embed-release-notes는 필수다. 빼면 dist/VimAction-$VERSION.md가 <description>에
          # 인라인되는 대신 sparkle:releaseNotesLink로 나가는데, 그 URL은 --download-url-prefix가 아니라
          # 앱 Info.plist의 SUFeedURL 기준(releases/latest/download/VimAction-$VERSION.md)으로 만들어지고
          # 그 자산은 업로드하지 않으므로 404가 된다.
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/pilyang/vim-action/releases/download/$GITHUB_REF_NAME/" \
            --embed-release-notes \
            --full-release-notes-url "https://github.com/pilyang/vim-action/releases" \
            -o dist/appcast.xml \
            dist
          rm "$KEY_FILE"
          cat dist/appcast.xml

      # non-prerelease로 발행해야 releases/latest가 이 릴리스를 가리킨다.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --notes-file 본문이 맨 위에 오고 그 아래로 --generate-notes의 "What's Changed"가 붙는다
          # (body가 있으면 GitHub이 자동 생성 노트 앞에 prepend). 태그 본문 = 사람이 쓴 요약,
          # 자동 생성 = PR 전수 목록으로 역할이 갈린다.
          # --notes-from-tag는 --generate-notes와 배타적이고 제목 줄까지 끌어오므로 쓰지 않는다.
          gh release create "$GITHUB_REF_NAME" \
            "dist/VimAction-$VERSION.dmg" \
            "dist/appcast.xml" \
            --verify-tag \
            --title "VimAction $VERSION" \
            --notes-file "dist/VimAction-$VERSION.md" \
            --generate-notes

      # tap 레포(pilyang/homebrew-tap)의 cask version·sha256을 교체해 푸시한다.
      # 기본 GITHUB_TOKEN은 다른 레포에 푸시할 수 없어 tap 한정 fine-grained PAT를 쓴다.
      - name: Bump Homebrew cask
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          SHA256=$(shasum -a 256 "dist/VimAction-$VERSION.dmg" | awk '{print $1}')
          git clone --depth 1 \
            "https://x-access-token:$TAP_PUSH_TOKEN@github.com/pilyang/homebrew-tap.git" \
            "$RUNNER_TEMP/homebrew-tap"
          cd "$RUNNER_TEMP/homebrew-tap"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/" Casks/vimaction.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/vimaction.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "vimaction $VERSION"
          git push

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          security list-keychains -d user -s login.keychain-db
