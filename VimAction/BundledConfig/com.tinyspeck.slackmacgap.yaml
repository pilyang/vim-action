# Slack — Return **sends the message** instead of inserting a line break, but
# Shift-Return does insert one. So o/O keep working here; they just use a
# different newline key. Without this override they would send a half-written
# message. (Only the newline key is replaced — the caret still moves with the
# usual motions, so o still means "end of line, then new line".)
name: Slack
actions:
  open_line: [shift-return]
